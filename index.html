<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (IMPORTANT) -->
    <title>Workfast AI | Enterprise Franchise Management</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon-v2.ico" />

    <!-- Primary Meta -->
    <meta
      name="description"
      content="Workfast AI is a professional franchise management platform to manage branches, projects, and operational tasks with real-time insights."
    />
    <meta name="author" content="Workfast AI" />
    <meta
      name="keywords"
      content="franchise management, project management, task tracking, operations dashboard, SaaS, enterprise tools"
    />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:title" content="Workfast AI | Enterprise Franchise Management" />
    <meta
      property="og:description"
      content="Professional management platform for franchise networks with analytics, task health, and operational insights."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-vercel-url.vercel.app" />
    <meta property="og:image" content="/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Workfast AI" />
    <meta
      name="twitter:description"
      content="Enterprise-grade franchise & project management platform."
    />
    <meta name="twitter:image" content="/og-cover.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color (mobile browsers) -->
    <meta name="theme-color" content="#0f172a" />
  </head>

    <div id="root"></div>

    <!-- Vite Entry -->
    <script type="module" src="/src/main.tsx"></script>
